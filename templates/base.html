<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{% block title %}AI Review Insight{% endblock %}</title>

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.css" rel="stylesheet">

    <!-- CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">

</head>

<body>

<!-- ================= NAVBAR ================= -->

<nav class="navbar navbar-expand-lg custom-navbar">

<div class="container">

<a class="navbar-brand logo" href="/">

🤖 AI Review Insight

<span>Analyze Reviews Smarter</span>

</a>

<button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbar">

<span class="navbar-toggler-icon"></span>

</button>

<div class="collapse navbar-collapse justify-content-end" id="navbar">

<ul class="navbar-nav">

<li class="nav-item">
<a class="nav-link {% if request.path=='/' %}active{% endif %}" href="/">
<i class="bi bi-house"></i> Home
</a>
</li>

<li class="nav-item">
<a class="nav-link {% if '/history' in request.path %}active{% endif %}" href="/history">
<i class="bi bi-clock-history"></i> History
</a>
</li>

<li class="nav-item">
<a class="nav-link {% if '/dashboard' in request.path %}active{% endif %}" href="/dashboard">
<i class="bi bi-bar-chart-line"></i> Dashboard
</a>
</li>

</ul>
<div class="theme-switch ms-3">

    <input type="checkbox" id="themeToggle">

    <label for="themeToggle" class="switch">

        <i class="bi bi-sun-fill sun"></i>

        <i class="bi bi-moon-stars-fill moon"></i>

        <span class="slider"></span>

    </label>

</div>
</div>

</div>

</nav>

<!-- ================= MAIN ================= -->

<main>

{% block content %}

{% endblock %}

</main>

<!-- ================= FOOTER ================= -->

<footer>

<div class="container">

<div class="footer-content">

<div>

<h5>🤖 AI Review Insight</h5>

<p>Analyze Reviews Smarter</p>

</div>

<div>

<p>

Powered by

<strong>Flask</strong>

•

<strong>Hugging Face</strong>

•

<strong>MongoDB</strong>

•

<strong>Plotly</strong>

</p>

</div>

</div>

</div>

</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>
<script>

const toggle = document.getElementById("themeToggle");

if(localStorage.getItem("theme") === "dark"){

    document.body.classList.add("dark-mode");

    toggle.checked = true;

}

toggle.addEventListener("change",()=>{

    document.body.classList.toggle("dark-mode");

    if(document.body.classList.contains("dark-mode")){

        localStorage.setItem("theme","dark");

    }else{

        localStorage.setItem("theme","light");

    }

});

</script>
</body>

</html>
